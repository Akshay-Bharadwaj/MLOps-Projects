name: Fraud Detection CI/CD

on:
  push:
    paths:
      - 'FraudDetection/**'

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          cd Fraud-Detection
          docker build -t fraud-detection-api .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker Images
        run: |
          docker tag fraud-detection-api ${{ secrets.DOCKER_USERNAME }}/fraud-detection-api:latest
          docker tag fraud-detection-api ${{ secrets.DOCKER_USERNAME }}/fraud-detection-api:${{ github.sha }}

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/fraud-detection-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/fraud-detection-api:${{ github.sha }}
